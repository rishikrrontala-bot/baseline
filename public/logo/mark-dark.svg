<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Baseline">
  <title>Baseline</title>
  <!--
    The mark is one idea twice: an eye sitting on a baseline, and a letterform
    sitting on a typographic one. The ring is tangent to the rule rather than
    crossing it, so it rests on the line the way type does. The pupil is
    deliberately off centre, because the whole product is about measuring how
    far something has drifted from where it started.
  -->
  <g fill="none" stroke="#EFE7E2" stroke-width="5" stroke-linecap="square">
    <circle cx="50" cy="46" r="30"/>
    <line x1="4" y1="76" x2="96" y2="76"/>
  </g>
  <circle cx="59.5" cy="39" r="10.5" fill="#B8794A"/>
</svg>
