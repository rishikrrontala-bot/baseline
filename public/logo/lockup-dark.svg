<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 100" width="430" height="100" role="img" aria-label="Baseline">
  <title>Baseline</title>
  <!--
    One rule carries the whole lockup. The ring is tangent to it and the
    wordmark sits on it, so the mark and the name share a literal baseline.
    Circle bottom (cy 46 + r 30), the rule, and the type baseline are all y=76.
  -->
  <g fill="none" stroke="#EFE7E2" stroke-width="5" stroke-linecap="square">
    <circle cx="50" cy="46" r="30"/>
    <line x1="4" y1="76" x2="426" y2="76"/>
  </g>
  <circle cx="59.5" cy="39" r="10.5" fill="#B8794A"/>
  <text x="126" y="76" fill="#EFE7E2"
        font-family="'Bodoni Moda', Didot, 'Bodoni MT', Georgia, serif"
        font-size="62" letter-spacing="-1">Baseline</text>
</svg>
