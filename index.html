  <body>
    <!--
      THESIS: The screening is three named rooms — Prepare, Screen, Findings —
      each holding one job, refusing the wizard that hides where you are.
      OWN-WORLD: Bright blush paper and Instrument Serif for the room you walk
      in from; a luminance-capped dim room, #12100F ground with #C9BFB6 ink and
      a single amber, for the rooms you are measured in. Mono micro-labels,
      hairline rules, no cards, no gradients, no shadow.
      STORY: Symptoms are self-reported and under-reported; eye movement is not.
      The visitor screens honestly, is paced, and is routed to a professional.
      FIRST VIEWPORT: The dim room fills the screen. The room name sits alone at
      the top; the single job holds the centre at instrument scale; the one way
      onward waits at the bottom edge. Stop is always present, never hidden.
      FORM: Three Rooms — index 7 of 7 ranked; seed 59ccf3b0, re-roll round 2.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
    -->
    <div id="root"></div>
    <noscript>
      <div style="padding: 48px; font-family: Georgia, serif; max-width: 640px">
        <h1>Baseline</h1>
        <p>
          A browser-based vestibular and ocular-motor screening tool for concussion recovery. It
          needs JavaScript, because the entire measurement runs on your own device — there is no
          server to fall back to.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
